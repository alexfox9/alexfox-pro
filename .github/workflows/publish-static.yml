name: Build website for Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-static
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Record source revision
        run: git rev-parse HEAD > dist/source-revision.txt
      - name: Check out generated branch
        uses: actions/checkout@v4
        with:
          ref: deploy
          path: .publish
      - name: Publish built files
        run: |
          rsync -a --delete --exclude='.git' dist/ .publish/
          cd .publish
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'Built website is unchanged.'
            exit 0
          fi
          git commit -m "Build website from $(cat source-revision.txt)"
          git push origin HEAD:deploy
